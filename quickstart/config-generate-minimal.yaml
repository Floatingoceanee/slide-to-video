# Quick Start Configuration
# Minimal config for PDF slides → video

# === REQUIRED ===
model: local                    # TTS engine: local, playht, openai-tts
slide: my_slides.pdf            # Your PDF slide deck
script: script.txt              # Your narration script
output_dir: output              # Where to save the output

# Voice sample for cloning (10-30 seconds of your voice)
voice: sample.mp3

# === OPTIONAL (with defaults) ===
# language: en                   # Language code (en, zh-cn, es, fr, etc.)
# speech_speed: 1.0              # Speech speed multiplier (0.5-2.0)
# delay: 2.0                     # Delay between slides (seconds)
# enable_subtitle: true           # Generate subtitles
# subtitle_mode: soft             # "soft" (muxed) or "hard" (burned in)
# whisper_model_size: base        # tiny, base, small, medium, large
# no_interactive: false           # Skip all interactive prompts

# === LLM PROOFREADING (optional) ===
# To enable LLM-based subtitle proofreading:
# 1. Set environment variable: export GLM_API_KEY=your_api_key
# 2. Uncomment the following:
#
# proofread:
#   method: llm
#   llm:
#     provider: glm
#     model: glm-4-flash
#     temperature: 0.1
