# Full Featured Configuration
# Demonstrates all available options including multi-LLM support

# === REQUIRED ===
model: local                    # TTS engine: local, playht, openai-tts
slide: my_slides.pdf            # PDF slide deck
script: script.txt              # Narration script
output_dir: output              # Output directory

# === TTS SETTINGS ===
voice: sample.mp3               # Voice sample for cloning (local engine)
language: en                    # en, es, fr, de, it, pt, pl, tr, ru, nl, cs, ar, zh-cn, hu, ko, ja, hi
speech_speed: 1.0               # Speed multiplier (0.5-2.0)
delay: 2.0                      # Seconds between slides

# === SUBTITLE SETTINGS ===
enable_subtitle: true           # Enable/disable subtitle generation
subtitle_mode: hard             # "soft" (fast, toggleable) or "hard" (burned in)
whisper_model_size: base        # tiny, base, small, medium, large
no_interactive: false           # Set true to skip confirmation prompts

# === SUBTITLE PROOFREADING ===
proofread:
  method: llm                   # "vocabulary" (word matching) or "llm" (LLM API)
  llm:
    provider: glm               # glm, claude, qwen, kimi, ollama, openai-compatible
    model: glm-4-flash          # Model name depends on provider
    # api_key: xxx               # Optional, uses env var if not set
    temperature: 0.1            # Lower = more deterministic (0-1)

# === SUBTITLE STYLE (hard mode only) ===
subtitle_style:
  Fontname: Arial               # Font family
  FontSize: 28                  # Font size in pixels
  PrimaryColour: "&HFFFFFF&"    # Text color: white (BGR format)
  OutlineColour: "&H000000&"    # Outline color: black
  Outline: 2                    # Outline width
  Shadow: 1                     # Shadow depth
  Alignment: 2                  # Position: 2=bottom-center
  MarginV: 40                   # Vertical margin

